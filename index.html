<!DOCTYPE html>
<html lang="pt-BR" data-theme="main">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" />

    <title>FAQ sobre PEP e PREP</title>

    <!-- DESIGN TOKENS + THEMES (default / exposicao) -->
    <link rel="stylesheet" href="./tokens.css" />

    <!-- COMPONENT + LAYOUT STYLES (hero, feature cards, buttons, etc.) -->
    <link rel="stylesheet" href="./styles.css" />

    <!-- React 18 (CDN build, UMD globals) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Howler for audio playback -->
    <script
      crossorigin
      src="https://unpkg.com/howler@2.2.4/dist/howler.min.js"
    ></script>
  </head>

  <body class="bg-page text-primary">
    <!-- React root -->
    <div id="root"></div>

    <!-- App logic (router, theme switcher, pages) -->
    <script src="./app.js"></script>

    <!-- Service Worker registration -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./sw.js")
          .catch(function (err) {
            console.warn("SW registration failed", err);
          });
      }
    </script>
  </body>
</html>
